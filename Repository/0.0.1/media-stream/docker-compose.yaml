---
services:
  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
    volumes:
      - ${SONARR_CONFIG_VOLUME}:/config:z
      - ${SHOWS_MEDIA_FOLDER}:/tv:Z #optional
      - ${DOWNLOAD_LOCATION}:/downloads:Z #optional
    ports:
      - 8989:8989
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
    volumes:
      - ${PROWLARR_CONFIG_VOLUME}:/config:z
    ports:
      - 9696:9696
    restart: unless-stopped

  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
    volumes:
      - ${RADARR_CONFIG_VOLUME}:/config:z
      - ${MOVIE_MEDIA_FOLDER}:/movies:Z #optional
      - ${DOWNLOAD_LOCATION}:/downloads:Z #optional
    ports:
      - 7878:7878
    restart: unless-stopped

  qbitorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=8080
    volumes:
      - ${TORRENT_CONFIG_VOLUME}:/config:z
      - ${DOWNLOAD_LOCATION}:/downloads:Z
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped
