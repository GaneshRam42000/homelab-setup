---
services:
  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ:-UTC}
    userns_mode: keep-id
    volumes:
      - ${SONARR_CONFIG_VOLUME}:/config:z
      - ${SHOWS_MEDIA_FOLDER}:/tv:z #optional
      - ${DOWNLOAD_LOCATION}:/downloads:z #optional
    ports:
      - 8989:8989
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ:-UTC}
    userns_mode: keep-id
    volumes:
      - ${PROWLARR_CONFIG_VOLUME}:/config:z
    ports:
      - 9696:9696
    restart: unless-stopped

  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ:-UTC}
    userns_mode: keep-id
    volumes:
      - ${RADARR_CONFIG_VOLUME}:/config:z
      - ${MOVIE_MEDIA_FOLDER}:/movies:z #optional
      - ${DOWNLOAD_LOCATION}:/downloads:z #optional
    ports:
      - 7878:7878
    restart: unless-stopped

  qbitorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=8080
    volumes:
      - ${TORRENT_CONFIG_VOLUME}:/config:z
      - ${DOWNLOAD_LOCATION}:/downloads:z
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ:-UTC}
    volumes:
      - ${BAZARR_CONFIG_VOLUME}:/config:z
      - ${MOVIE_MEDIA_FOLDER}:/movies:z #optional
      - ${SHOWS_MEDIA_FOLDER}:/tv:z #optional
    ports:
      - 6767:6767
    restart: unless-stopped

  jellyseerr:
    image: ghcr.io/fallenbagel/jellyseerr:latest
    init: true
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ:-UTC}
      #- PORT=5055 #optional
    ports:
      - 5055:5055
    volumes:
      - ${SEER_CONFIG_VOLUME:-/Homelab/Files/AppData/Config/Jellyseer}:/app/config:z
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
